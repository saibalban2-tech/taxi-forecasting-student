name: CI — Lint · Test · Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Run ruff
        run: ruff check src/ scripts/ dashboard/ tests/

  # ── 2. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ -q \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=75
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── 3. Integration smoke tests ─────────────────────────────────────────────
  integration-tests:
    name: Integration smoke tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integration tests (offline/synthetic)
        run: python -m pytest tests/integration/ -q --tb=short -m "not aws"

  # ── 4. Docker build ────────────────────────────────────────────────────────
  docker-build:
    name: Docker build (API image)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: taxi-forecasting-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Docker build — Dashboard ────────────────────────────────────────────
  docker-build-dashboard:
    name: Docker build (Dashboard image)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build dashboard image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          tags: taxi-forecasting-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
