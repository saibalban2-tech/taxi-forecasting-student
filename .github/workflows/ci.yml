name: CI — Lint · Test · Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Run ruff
        run: ruff check src/ scripts/ dashboard/ tests/

  # ── 2. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (102 tests, ≥75% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ -q \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=75
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── 3. Integration smoke tests ─────────────────────────────────────────────
  integration-tests:
    name: Integration smoke tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integration tests (offline / synthetic data only)
        run: python -m pytest tests/integration/ -q --tb=short -m "not aws"

  # ── 4. Docker build — API (dependency layer only; model artefacts are
  #        trained locally and never committed to VCS)
  docker-build-api:
    name: Docker build — API (builder stage)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image (builder stage — verifies Dockerfile + deps)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          # Build only the builder stage so CI doesn't require committed
          # mlruns/ or mlflow.container.db (those are trained locally).
          # The full production image (with baked models) is built via
          # `docker compose -f docker/docker-compose.yml build` after training.
          target: builder
          push: false
          tags: taxi-forecasting-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Docker build — Dashboard (self-contained; reads committed artefacts)
  docker-build-dashboard:
    name: Docker build — Dashboard (full image)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          tags: taxi-forecasting-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
